<main>
  <p-table
    [value]="array"
    [paginator]="true"
    [rows]="5"
    [tableStyle]="{ 'min-width': '50rem' }"
    [rowsPerPageOptions]="[5, 10, 20]"
  >
    <ng-template #header>
      <tr>
        <th>Id</th>
        <th>Tarea</th>
        <th>IsCompleted</th>
        <th>Fecha de creacion</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-todo>
      <tr>
        <td>{{ todo.id }}</td>
        <td>{{ todo.task }}</td>
        <td>{{ todo.isCompleted }}</td>
        <td>{{ todo.created }}</td>
        <td>
          <p-button icon="pi pi-pencil"></p-button>
          <p-button icon="pi pi-trash"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</main>
